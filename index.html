<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="tiktok-developers-site-verification" content="1Eb0bc8VXxNFTPrCuqaYAKPsovod4WnQ">
<title>Little Wonder Auto</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #555555;
    --accent: #6b46c1;
    --border: #e5e5e5;
    --card-bg: #f9f8fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121a;
      --text: #f0eef5;
      --muted: #b8b3c4;
      --accent: #b794f4;
      --border: #2c2836;
      --card-bg: #1c1926;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
    padding: 0 20px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 0 80px;
    text-align: center;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 10px;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 40px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 320px;
    margin: 0 auto;
  }
  .links a {
    display: block;
    padding: 14px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
  }
  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  footer {
    margin-top: 3em;
    padding-top: 1.2em;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Little Wonder Auto</h1>
  <p class="tagline">Legal information for the "Little Wonder Tales" video project.</p>

  <div class="links">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>

  <footer>
    Little Wonder Auto
  </footer>
</main>
</body>
</html>
